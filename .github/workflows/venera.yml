name: Venera Auto Build

# 自动把 CyrilPeng/Venera-Next 的官方 Windows 版打成 MSIX Bundle 并发布到 GitHub Release，
# 供上传微软商店。每天检查一次上游，只有真有变化才构建。
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: force build
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# 同一时刻只允许一次运行，避免两次运行互相覆盖 latest 发布 / git push 冲突
concurrency:
  group: venera-build
  cancel-in-progress: false

jobs:
  # ============================================================
  # check: 判断上游是否有变化（不打完整包，几十秒结束）
  # ============================================================
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.c.outputs.changed }}
      tag:     ${{ steps.c.outputs.tag }}
      ver:     ${{ steps.c.outputs.ver }}
      mm:      ${{ steps.c.outputs.mm }}
      zipurl:  ${{ steps.c.outputs.zipurl }}
      zipsize: ${{ steps.c.outputs.zipsize }}
      zupd:    ${{ steps.c.outputs.zupd }}
      build:   ${{ steps.c.outputs.build }}
      iconhash: ${{ steps.c.outputs.iconhash }}
      wfhash:   ${{ steps.c.outputs.wfhash }}
      reason:   ${{ steps.c.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check upstream
        id: c
        run: |
          # GitHub 默认用 `bash -e`（errexit）跑 run 块：任何一条命令返回非 0 就【静默】退出，
          # 连 ::error:: 都来不及打印 —— 我们刚踩过这个坑
          # （仓库里没有 source.png，sha256sum 失败 → 8 秒退出码 1，注解里什么都没有）。
          # 这里显式关掉 errexit，改由脚本自己判断哪些情况算致命（下面有明确的 ::error:: + exit 1）。
          set +e
          set -o pipefail
          REPO="CyrilPeng/Venera-Next"

          echo "=== 第 1 步: 读本地记录 ==="
          O=""
          if [ -f .venera-ver ]; then O=$(cat .venera-ver | tr -d '\r\n"' | tr -d ' '); fi
          echo "recorded = ${O:-（无）}"

          echo "=== 第 2 步: 用 API 解析最新稳定版（带 token，配额 5000/小时）==="
          # 为什么不拼文件名：上游一旦改资产命名，拼字符串就失效、流水线停摆。
          # 这里直接列 assets 按模式匹配，并顺带拿到 size 与 updated_at ——
          # updated_at 能发现「同名同大小重传」，HEAD 拿不到这个信息。
          REL=$(curl -sS --max-time 60 --retry 3 \
                 -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$REPO/releases/latest" 2>/dev/null || true)

          JQ_F='[.assets[] | select(.name|test("windows.*\\.zip$")) | select(.name|test("installer")|not)] | .[0]'
          TAG=$(echo "$REL"   | jq -r '.tag_name // empty' 2>/dev/null || true)
          ZURL=$(echo "$REL"  | jq -r "$JQ_F | .browser_download_url // empty" 2>/dev/null || true)
          ZSIZE=$(echo "$REL" | jq -r "$JQ_F | .size // empty" 2>/dev/null || true)
          ZUPD=$(echo "$REL"  | jq -r "$JQ_F | .updated_at // empty" 2>/dev/null || true)

          if [ -z "$TAG" ] || [ -z "$ZURL" ] || [ -z "$ZSIZE" ]; then
            echo "::warning::API 解析未成功（tag='$TAG' url='$ZURL' size='$ZSIZE'），回退到「重定向 + 拼文件名」"
            LOC=$(curl -sSI --max-time 60 --retry 3 \
                   "https://github.com/$REPO/releases/latest" \
                   | grep -i '^location:' | tail -1 | tr -d '\r' | sed 's/^[Ll]ocation: *//' || true)
            TAG=$(echo "$LOC" | grep -o 'releases/tag/[^/?#]*' | sed 's|releases/tag/||' || true)
            if [ -z "$TAG" ]; then
              echo "::error::两种方式都拿不到 tag（上游可能改了发布方式，或网络异常）"
              exit 1
            fi
            V0="${TAG#v}"
            ZURL="https://github.com/$REPO/releases/download/$TAG/VeneraNext-$V0-windows.zip"
            ZSIZE=$(curl -sSIL --max-time 60 --retry 3 "$ZURL" \
                    | grep -i '^content-length:' | tail -1 | tr -d '\r' \
                    | sed 's/^[Cc]ontent-[Ll]ength: *//' | tr -d '"' || true)
            ZUPD="unknown"
          fi

          if [ -z "$TAG" ] || [ -z "$ZURL" ]; then
            echo "::error::无法确定上游版本或资产"
            exit 1
          fi
          VER="${TAG#v}"
          MM=$(echo "$VER" | cut -d. -f1,2)
          echo "tag              = $TAG"
          echo "version          = $VER   major.minor = $MM"
          echo "zip              = $ZURL"
          echo "size             = ${ZSIZE:-（未取到）} bytes"
          echo "asset updated_at = ${ZUPD:-（未取到）}"
          if [ -z "$ZSIZE" ] || [ "$ZSIZE" -lt 10000000 ]; then
            echo "::error::zip 大小异常（$ZSIZE），上游可能改了资产命名"
            exit 1
          fi

          echo "=== 第 5 步: 上游 build 号（仅用于展示）==="
          # release.json 可能不存在（只是显示用），失败不能拖垮整个检查
          B=$(curl -sSL --max-time 30 --retry 2 \
              "https://raw.githubusercontent.com/$REPO/$TAG/release.json" \
              | grep -o '"build": *[0-9]*' | head -1 | sed 's/.*: *//' || true)
          if [ -z "$B" ]; then B="0"; fi
          echo "upstream build = $B"

          echo "=== 第 6 步: 指纹（5 段式）==="
          # tag | 资产大小 | 资产更新时间 | 图标源哈希 | 工作流哈希
          # 把「图标源」和「工作流自身」算进来，否则换图标/改脚本后会被判「无更新」而永久跳过。
          # 注意：GitHub 的 bash 是 `bash -e`（errexit），我们还开了 pipefail。
          # source.png 缺失时 sha256sum 返回非 0，会【静默】让整个脚本退出（退出码 1、无任何提示）。
          # 而「没放图标」完全正常（工作流会自动取上游官方图标），所以必须 `|| true` 兜住。
          ICON_HASH=$(sha256sum .github/store-icons/source.png 2>/dev/null | cut -c1-16 || true)
          if [ -z "$ICON_HASH" ]; then ICON_HASH="noicon"; fi
          WF_HASH=$(sha256sum .github/workflows/venera.yml 2>/dev/null | cut -c1-16 || true)
          if [ -z "$WF_HASH" ]; then WF_HASH="nowf"; fi
          N="$TAG|$ZSIZE|$ZUPD|$ICON_HASH|$WF_HASH"
          echo "current  = $N"
          echo "recorded = ${O:-（无）}"

          echo "=== 第 7 步: 逐段比对，说明这次是什么变了 ==="
          # 邮件里会带上这个原因，方便一眼判断「该不该发这一版」
          REASON="首次构建（本地无记录）"
          if [ -n "$O" ]; then
            IFS='|' read -r oTag oSize oUpd oIcon oWf <<< "$O"
            R=""
            if [ "$TAG"       != "$oTag"  ]; then R="$R 上游版本"; fi
            if [ "$ZSIZE"     != "$oSize" ]; then R="$R 上游文件"; fi
            if [ "$ZUPD"      != "$oUpd"  ]; then R="$R 上游重传"; fi
            if [ "$ICON_HASH" != "$oIcon" ]; then R="$R 图标"; fi
            if [ "$WF_HASH"   != "$oWf"   ]; then R="$R 工作流"; fi
            if [ -n "$R" ]; then REASON="变化:$R"; else REASON="无实际变化"; fi
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then REASON="$REASON（手动 force）"; fi
          echo "reason = $REASON"

          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$N" != "$O" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          {
            echo "tag=$TAG"
            echo "ver=$VER"
            echo "mm=$MM"
            echo "zipurl=$ZURL"
            echo "zipsize=$ZSIZE"
            echo "zupd=$ZUPD"
            echo "build=$B"
            echo "iconhash=$ICON_HASH"
            echo "wfhash=$WF_HASH"
            echo "reason=$REASON"
          } >> $GITHUB_OUTPUT

      - name: Heartbeat
        if: always()
        continue-on-error: true
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '%s | tag=%s | changed=%s\n' "$TS" "${{ steps.c.outputs.tag }}" "${{ steps.c.outputs.changed }}" > .venera-heartbeat
          git add .venera-heartbeat
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: heartbeat [skip ci]"
          git pull --rebase --autostash origin main || echo "::warning::rebase 失败（心跳未提交）"
          git push || echo "::warning::push 失败 —— 若连续 60 天无法提交，GitHub 会自动禁用本工作流"

      - name: Prune old artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 保留兜底 artifact，否则发布失败时就没有可下载的包了
          KEEP="venera-msixbundle"
          gh api "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id)|\(.name)"' > /tmp/arts.txt || true
          N=0
          while IFS='|' read -r ID NAME; do
            [ -z "$ID" ] && continue
            if [ "$NAME" = "$KEEP" ]; then continue; fi
            gh api -X DELETE "repos/$REPO/actions/artifacts/$ID" >/dev/null 2>&1 || \
              echo "::warning::删除 artifact $ID 失败"
            N=$((N+1))
          done < /tmp/arts.txt
          echo "已清理 $N 个旧 artifact（保留 $KEEP）"

  # ============================================================
  # build: 只有指纹变化时才跑
  # ============================================================
  build:
    needs: [check]
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download upstream windows zip
        run: |
          $url  = "${{ needs.check.outputs.zipurl }}"
          $want = [int64]"${{ needs.check.outputs.zipsize }}"
          $f = "$env:RUNNER_TEMP\v.zip"
          Remove-Item $f -Force -ErrorAction SilentlyContinue
          Write-Host "url = $url"
          curl.exe -L --retry 5 --retry-delay 5 --retry-all-errors --max-time 900 -o $f $url
          if (-not (Test-Path $f)) { throw "下载失败" }
          $sz = (Get-Item $f).Length
          Write-Host "downloaded = $sz bytes (upstream $want)"
          if ($sz -lt 10MB) { throw "下载文件过小: $sz" }
          if ($want -gt 0 -and $sz -ne $want) { throw "大小不符: $sz vs $want（下载可能被截断）" }
          Write-Host "download OK"

      - name: Extract payload
        run: |
          $ErrorActionPreference = "Stop"
          $f = "$env:RUNNER_TEMP\v.zip"
          $tmp = "C:\V"
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Expand-Archive -Path $f -DestinationPath $tmp -Force
          $inner = @(Get-ChildItem $tmp -Directory)
          if ($inner.Count -ne 1) { throw "zip 结构异常: 期望 1 个顶层目录，实际 $($inner.Count)" }
          $root = $inner[0].FullName
          Write-Host "payload root = $root"
          $exe = Join-Path $root "VeneraNext.exe"
          if (-not (Test-Path $exe)) { throw "未找到 VeneraNext.exe" }
          $n = @(Get-ChildItem $root -Recurse -File -Force).Count
          Write-Host "payload files = $n"
          if ($n -lt 50) { throw "payload 文件过少: $n" }

      # GitHub 对单个 run 块的表达式有 21000 字符上限，
      # 所以 Pack 拆成 3 步（各自都远低于上限），共用同一个 runner 上的 C:\S。
      - name: Pack 1/3 - stage (version + payload + runtime)
        id: stage
        run: |
          $ErrorActionPreference = "Stop"
          # PowerShell 7 会把原生程序写到 stderr 的内容当错误并终止（curl 的进度条就在 stderr）。
          # 关掉这个行为，否则 curl 一输出进度就会把步骤判失败。
          $PSNativeCommandUseErrorActionPreference = $false
          # 让任何未捕获的失败都以 ::error:: 出现在 Actions 的 Annotations 里，便于远程诊断。
          trap {
            Write-Host "::error title=Pack-1-3::失败: $($_.Exception.Message)"
            Write-Host $_.InvocationInfo.PositionMessage
            exit 1
          }
          $root = "C:\V\" + (Get-ChildItem "C:\V" -Directory)[0].Name
          Write-Host "payload root = $root"

          # ---------- 定位 makeappx / makepri ----------
          function Find-Kit([string]$exe) {
            $p = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\$exe"
            if (Test-Path $p) { return $p }
            foreach ($base in @("C:\Program Files (x86)\Windows Kits\10\bin", "C:\Program Files\Windows Kits\10\bin")) {
              $c = @(Get-ChildItem $base -Filter $exe -Recurse -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending)
              if ($c.Count -gt 0) { return $c[0].FullName }
            }
            return $null
          }
          $mk = Find-Kit "makeappx.exe"
          if (-not $mk) { throw "未找到 makeappx.exe（Windows Kits 未安装？）" }
          $mp = Find-Kit "makepri.exe"
          Write-Host "makeappx = $mk"
          Write-Host "makepri  = $(if ($mp) { $mp } else { '(未找到!)' })"

          # ---------- MSIX 版本 ----------
          # 商店两条硬性规则:
          #   (1) 新提交的版本必须【高于】商店上已发布的版本，否则拒收(降级)。
          #   (2) 第 4 段(Revision) 必须为 0。
          # 商店上已发布的是 2026.1014.1744.0（日期时间式）。
          # 因此绝不能用 1.18.x.0 这种形式 —— 第 1 段 1 < 2026，会被判为降级。
          # 这里沿用同样的日期时间风格 yyyy.MMdd.HHmm.0 (UTC)，天然单调递增。
          $now = (Get-Date).ToUniversalTime()
          $v = "{0}.{1}.{2}.0" -f [int]$now.ToString("yyyy"), [int]$now.ToString("MMdd"), [int]$now.ToString("HHmm")
          Write-Host "MSIX version = $v   (upstream ${{ needs.check.outputs.ver }} build ${{ needs.check.outputs.build }})"
          Write-Host "       已发布版本为 2026.1014.1744.0，本版本必须更大"
          $vp = $v.Split('.')
          if ($vp.Count -ne 4) { throw "版本格式错误: $v" }
          if ($vp[3] -ne "0") { throw "第 4 段必须为 0: $v" }
          foreach ($seg in $vp) {
            $n = 0
            if (-not [int64]::TryParse($seg, [ref]$n)) { throw "版本段不是数字: $v" }
            if ($n -gt 65535) { throw "版本段超过 65535: $v" }
          }
          if ([int]$vp[0] -lt 2026) { throw "版本第 1 段小于 2026，会被商店判为降级: $v" }
          "ver=$v"  | Out-File -Append $env:GITHUB_OUTPUT
          "mk=$mk"  | Out-File -Append $env:GITHUB_OUTPUT
          "mp=$mp"  | Out-File -Append $env:GITHUB_OUTPUT

          # ---------- 原样复制 payload ----------
          $s = "C:\S"
          if (Test-Path $s) { Remove-Item $s -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $s | Out-Null
          Get-ChildItem $root -Force | ForEach-Object { Copy-Item $_.FullName $s -Recurse -Force }

          # ---------- VC++ 运行库 app-local 部署 ----------
          # 上游 zip 不自带 msvcp140/vcruntime140 等 DLL，商店 MSIX 沙箱里也没有系统级 redist。
          # 框架依赖 Microsoft.VCLibs.140.00.UWPDesktop 商店不认（报 Neutral/Universal 不可用），
          # 因此把 runner 自带的 VC++ redist DLL 拷到 exe 同目录（微软允许 app-local）。
          Write-Host "=== 复制 VC++ 运行库 DLL (app-local) ==="
          # 实测：官方 zip 里【完全没有】msvcp140/vcruntime140 等 DLL（只有业务 DLL），
          # 全新系统/沙箱里不保证装了 redist，所以必须打进包。
          # 缺了关键 DLL = 用户装好后一启动就崩，因此这里【失败退出】而不是像以前那样只警告。
          # 这三个是【实测】出来的：解析整个 payload 的 PE 导入表（82 个被导入 DLL），
          # VeneraNext.exe 确实导入 MSVCP140 / VCRUNTIME140 / VCRUNTIME140_1，
          # 而官方 zip 里这三个一个都没有 —— 不补进去，用户端一启动就崩。
          # concrt140 则没有任何文件导入它（实测），所以不塞，省 200KB 无用体积。
          $vcCritical = @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")
          $vcOptional = @()
          $vcMissing  = @()
          foreach ($d in ($vcCritical + $vcOptional)) {
            $done = $false
            foreach ($dir in @("C:\Windows\System32", "C:\Windows\SysWOW64")) {
              $src = Join-Path $dir $d
              if (Test-Path $src) {
                Copy-Item $src (Join-Path $s $d) -Force
                Write-Host ("  bundled {0}  (from {1})" -f $d, $dir)
                $done = $true
                break
              }
            }
            if (-not $done) {
              if ($vcCritical -contains $d) {
                $vcMissing += $d
                Write-Host ("  MISSING(critical) {0}" -f $d)
              } else {
                Write-Host ("::warning::可选 DLL {0} 未找到，跳过" -f $d)
              }
            }
          }
          if ($vcMissing.Count -gt 0) {
            throw ("runner 上缺少关键 VC++ 运行库: " + ($vcMissing -join ", ") +
                   " —— 打进包会缺依赖导致用户端崩溃，因此中止构建")
          }

          # 泛化校验：扫出 staging 里所有被引用的 MSVC 运行库名，逐个确认已打进包。
          # 这样上游将来新增 msvcp140_2 / vcruntime140_2 之类也能自动发现，
          # 而不是等用户端崩溃才知道。（只匹配发行版名字，debug 版带 d 后缀不会误报）
          Write-Host "=== 校验 MSVC 运行库依赖 ==="
          $rtRef = @{}
          Get-ChildItem $s -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -match '^\.(exe|dll)$' } |
            ForEach-Object {
              $f = $_
              $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($f.FullName)).ToUpperInvariant()
              foreach ($m in [regex]::Matches($ascii, '(MSVCP[0-9]+(?:_[0-9]+)?|VCRUNTIME[0-9]+(?:_[0-9]+)?|CONCRT[0-9]+|VCCORLIB[0-9]+)\.DLL')) {
                $nm = $m.Value.ToLower()
                if (-not $rtRef.ContainsKey($nm)) { $rtRef[$nm] = New-Object System.Collections.ArrayList }
                if (-not $rtRef[$nm].Contains($f.Name)) { [void]$rtRef[$nm].Add($f.Name) }
              }
            }
          $rtMissing = @()
          foreach ($nm in ($rtRef.Keys | Sort-Object)) {
            if (Test-Path (Join-Path $s $nm)) {
              Write-Host ("  ok       {0}" -f $nm)
            } else {
              Write-Host ("::error::运行库 {0} 被引用但未打进包（引用者: {1}）" -f $nm, ($rtRef[$nm] -join ", "))
              $rtMissing += $nm
            }
          }
          if ($rtMissing.Count -gt 0) {
            throw ("以下 MSVC 运行库被引用但未打进包: " + ($rtMissing -join ", ") + " —— 用户端会加载失败")
          }
          Write-Host ("MSVC 运行库依赖校验通过（引用 {0} 个，全部已在包内）" -f $rtRef.Count)

          # ---------- 附加许可证与源码说明（GPL-3.0 合规）----------
          # GPL 要求把许可证副本随二进制一起交给用户。放在【包里】而不是商店描述里，
          # 商店列表就能保持低调、不含任何上游信息。
          # LICENSE 由仓库提供（.github/app-legal/LICENSE）；SOURCE.txt 在这里现生成。
          Write-Host "=== 附加许可证（GPL-3.0）==="
          # 两个位置都支持：仓库根目录 LICENSE，或 .github/app-legal/LICENSE
          $licSrc = $null
          foreach ($p in @("$env:GITHUB_WORKSPACE\LICENSE", "$env:GITHUB_WORKSPACE\.github\app-legal\LICENSE")) {
            if (Test-Path $p) { $licSrc = $p; break }
          }
          $licOk = $false
          if ($licSrc) {
            Copy-Item $licSrc (Join-Path $s "LICENSE") -Force
            $licOk = $true
            Write-Host ("  已附加 LICENSE（{0} 字节，来自 {1}）" -f (Get-Item $licSrc).Length, $licSrc)
          } else {
            Write-Host "::warning::未找到 LICENSE —— 建议上传一份 GPL-3.0 全文到仓库根目录"
          }
          $srcNote = @(
            "本应用由 Venera-Next 重新打包为 Windows 应用。"
            "遵循 GNU General Public License v3.0 (GPL-3.0)。"
            ""
            "对应源代码:"
            "https://github.com/CyrilPeng/Venera-Next"
            ""
            "本打包版所做的改动:"
            "- 添加 MSIX 应用清单 (AppxManifest.xml) 与资源索引 (resources.pri)"
            "- 附加 Microsoft Visual C++ 运行库 (app-local 部署)"
            "- 未修改上游任何程序文件"
            ""
            "许可证全文见同目录下的 LICENSE 文件。"
          )
          # 带 BOM 写：里面是中文，不带 BOM 时某些编辑器会用 GBK 打开变成乱码
          [IO.File]::WriteAllText((Join-Path $s "SOURCE.txt"), ($srcNote -join "`n"), (New-Object Text.UTF8Encoding $true))
          Write-Host "  已生成 SOURCE.txt"
          "lic=$licOk" | Out-File -Append $env:GITHUB_OUTPUT

          $staged = @(Get-ChildItem $s -Recurse -File -Force).Count
          Write-Host "staged = $staged"
          if ($staged -lt 50) { throw "暂存不完整: $staged" }

      - name: Pack 2/3 - icons + manifest
        id: icons
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          trap {
            Write-Host "::error title=Pack-2-3::失败: $($_.Exception.Message)"
            Write-Host $_.InvocationInfo.PositionMessage
            exit 1
          }
          $s = "C:\S"
          $v = "${{ steps.stage.outputs.ver }}"
          Write-Host "MSIX version = $v"

          # ================= 图标：从 source.png 现生成 =================
          # 关键：targetsize 资产的前缀必须是清单里引用的名字（Square44x44Logo），
          # 用 AppList.* 是无效的 —— 清单从不引用 AppList，Windows 不会去读。
          $a = "$s\Assets"
          New-Item -ItemType Directory -Force -Path $a | Out-Null
          $srcIcon = "$env:GITHUB_WORKSPACE\.github\store-icons\source.png"
          if (-not (Test-Path $srcIcon)) {
            # 没放自定义图标时，自动取上游官方 app_icon.png。
            # 先按 release tag 取（与版本一致），失败再退回 main 分支，双保险。
            # 想换图标时，往 .github/store-icons/source.png 放一张即可覆盖。
            $upTag = "${{ needs.check.outputs.tag }}"
            $fb    = "$env:RUNNER_TEMP\source.png"
            $got   = $false
            foreach ($ref in @($upTag, "main")) {
              $u = "https://raw.githubusercontent.com/CyrilPeng/Venera-Next/$ref/assets/app_icon.png"
              Write-Host "尝试获取上游官方图标: $u"
              # -s 静默进度条（curl 默认写到 stderr，PowerShell 7 会当错误）；再兜一层 2>$null
              curl.exe -sSL --retry 3 --retry-delay 2 --retry-all-errors --max-time 120 -o $fb $u 2>$null
              if ((Test-Path $fb) -and ((Get-Item $fb).Length -gt 5000)) {
                Write-Host ("  成功，{0} 字节" -f (Get-Item $fb).Length)
                $got = $true
                break
              }
              Write-Host "  失败，换下一个来源"
            }
            if (-not $got) {
              throw "无法获取上游官方图标（tag=$upTag 与 main 都失败）—— 请把 app_icon.png 放到 .github/store-icons/source.png"
            }
            $srcIcon = $fb
          }
          Write-Host "generating icons from $srcIcon"
          Add-Type -AssemblyName System.Drawing

          # 品牌底色下面会从源图自动采样（不再写死），用于宽磁贴/启动画面的留白填充
          $BRAND = [System.Drawing.Color]::FromArgb(255, 14, 21, 34)
          $brandHex = "#0E1522"

          $srcImg = $null
          try {
            # .NET 对损坏/非图片文件会抛 OutOfMemoryException（信息误导），换算成可读原因
            try {
              $srcImg = [System.Drawing.Image]::FromFile($srcIcon)
            } catch {
              $fi = Get-Item $srcIcon -ErrorAction SilentlyContinue
              $head = ""
              try {
                $raw = [IO.File]::ReadAllBytes($srcIcon)
                $head = (($raw[0..([Math]::Min(11, $raw.Length-1))] | ForEach-Object { $_.ToString("X2") }) -join " ")
              } catch { }
              throw ("source.png 无法作为图片打开（文件可能损坏或不是图片格式）。大小=" +
                     $(if ($fi) { $fi.Length } else { "?" }) + " 字节，文件头=" + $head +
                     "，原始错误=" + $_.Exception.Message)
            }
            Write-Host ("source: {0}x{1}" -f $srcImg.Width, $srcImg.Height)
            if ($srcImg.Width -lt 256 -or $srcImg.Height -lt 256) {
              Write-Host "::warning::source.png 小于 256px，生成的图标可能模糊"
            }

            # 自动采样品牌底色：取四条边中点（避开中央 logo），再取平均（避开渐变极值）。
            # 这样上游若换图标配色，宽磁贴与清单背景会自动跟上，不会出现色块拼接。
            # 注意：坐标先算好再放进数组 —— 直接写 @($probe.Width - 3, ...) 
            # 会被 PowerShell 解析成「数组减数字」而报 op_Subtraction 错误。
            $probe = New-Object System.Drawing.Bitmap($srcIcon)
            $pw = $probe.Width; $ph = $probe.Height
            $cx = [int]($pw / 2); $cy = [int]($ph / 2)
            $pts = @()
            $pts += ,@(2, $cy)
            $pts += ,@($cx, 2)
            $pts += ,@(($pw - 3), $cy)
            $pts += ,@($cx, ($ph - 3))
            $samples = @()
            foreach ($pt in $pts) {
              if ($pt[0] -ge 0 -and $pt[0] -lt $pw -and $pt[1] -ge 0 -and $pt[1] -lt $ph) {
                $c = $probe.GetPixel($pt[0], $pt[1])
                if ($c.A -gt 200) { $samples += $c }
              }
            }
            $probe.Dispose()
            if ($samples.Count -gt 0) {
              $r = [int](($samples | Measure-Object -Property R -Average).Average)
              $g = [int](($samples | Measure-Object -Property G -Average).Average)
              $b = [int](($samples | Measure-Object -Property B -Average).Average)
              $BRAND = [System.Drawing.Color]::FromArgb(255, $r, $g, $b)
            } else {
              Write-Host "::warning::无法采样品牌底色，回退到 #0E1522"
            }
            $brandHex = "#{0:X2}{1:X2}{2:X2}" -f $BRAND.R, $BRAND.G, $BRAND.B
            Write-Host ("brand color = {0} (auto-sampled)" -f $brandHex)

            # ---------- 把圆角补成方角（方方正正铺满正方形）----------
            # 官方图标四角是透明的（圆角设计），所以任务栏/开始菜单看起来是圆角块。
            # 这里按行把左右两侧最近的实心像素向外延伸，填掉透明区域 ——
            # 比单色填充好：不会在源图的竖直渐变上留下色块接缝。
            $drawSrc = New-Object System.Drawing.Bitmap($srcIcon)
            $fw = $drawSrc.Width; $fh = $drawSrc.Height
            $fillRect = New-Object System.Drawing.Rectangle(0, 0, $fw, $fh)
            $bits = $drawSrc.LockBits($fillRect,
                      [System.Drawing.Imaging.ImageLockMode]::ReadWrite,
                      [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            try {
              $stride = $bits.Stride
              $buf = New-Object byte[] ($stride * $fh)
              [System.Runtime.InteropServices.Marshal]::Copy($bits.Scan0, $buf, 0, $buf.Length)
              $filled = 0
              for ($y = 0; $y -lt $fh; $y++) {
                $row = $y * $stride
                $lx = -1; $rx = -1
                for ($x = 0; $x -lt $fw; $x++) {
                  if ($buf[$row + $x * 4 + 3] -gt 200) {
                    if ($lx -lt 0) { $lx = $x }
                    $rx = $x
                  }
                }
                if ($lx -lt 0) { continue }
                for ($x = 0; $x -lt $lx; $x++) {
                  # 注意：这里绝不能用 $s 当临时变量 —— $s 是分阶段目录 "C:\S"，
                  # 被覆盖后写 AppxManifest.xml 的路径就会变成一串数字（踩过这个坑）。
                  $o = $row + $x * 4; $q = $row + $lx * 4
                  $buf[$o] = $buf[$q]; $buf[$o+1] = $buf[$q+1]; $buf[$o+2] = $buf[$q+2]; $buf[$o+3] = 255
                  $filled++
                }
                for ($x = $rx + 1; $x -lt $fw; $x++) {
                  $o = $row + $x * 4; $q = $row + $rx * 4
                  $buf[$o] = $buf[$q]; $buf[$o+1] = $buf[$q+1]; $buf[$o+2] = $buf[$q+2]; $buf[$o+3] = 255
                  $filled++
                }
              }
              [System.Runtime.InteropServices.Marshal]::Copy($buf, 0, $bits.Scan0, $buf.Length)
              Write-Host ("已把 {0} 个透明像素补成方角（源图 {1}x{2}）" -f $filled, $fw, $fh)
            } finally {
              $drawSrc.UnlockBits($bits)
            }

            # $Fit=$true  -> 留白模式（宽磁贴/启动画面）：填品牌色，logo 居中不裁切
            # $Fit=$false -> 铺满模式（方形资产）：方角源图直接 cover 缩放，铺满整个方块
            function New-Icon([string]$Path, [int]$W, [int]$H, [bool]$Fit) {
              $bmp = New-Object System.Drawing.Bitmap($W, $H, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.InterpolationMode  = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $g.PixelOffsetMode    = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
              $g.SmoothingMode      = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
              $g.CompositingQuality = [System.Drawing.Drawing2D.CompositingQuality]::HighQuality
              $sw = $drawSrc.Width; $sh = $drawSrc.Height
              if ($Fit) {
                $g.Clear($BRAND)
                $target = [Math]::Min($W, $H) * 0.70
                $scale  = $target / [double][Math]::Max($sw, $sh)
                $nw = [Math]::Max(1, [int][Math]::Round($sw * $scale))
                $nh = [Math]::Max(1, [int][Math]::Round($sh * $scale))
                $x = [int](($W - $nw) / 2); $y = [int](($H - $nh) / 2)
                $dst = New-Object System.Drawing.Rectangle($x, $y, $nw, $nh)
                $g.DrawImage($drawSrc, $dst)
              } else {
                # 铺满：源图已补成方角，用品牌色打底再 cover 缩放，
                # 连缩放产生的半透明边缘也会融进背景，不会露出底板。
                $g.Clear($BRAND)
                $scale = [Math]::Max($W / [double]$sw, $H / [double]$sh)
                $nw = [Math]::Max($W, [int][Math]::Round($sw * $scale))
                $nh = [Math]::Max($H, [int][Math]::Round($sh * $scale))
                $left = [int](($nw - $W) / 2); $top = [int](($nh - $H) / 2)
                $dst = New-Object System.Drawing.Rectangle(-$left, -$top, $nw, $nh)
                $g.DrawImage($drawSrc, $dst)
              }
              $g.Dispose()
              $bmp.Save($Path, [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
            }

            New-Icon (Join-Path $a "StoreLogo.png")          50  50  $false
            New-Icon (Join-Path $a "Square44x44Logo.png")    44  44  $false
            New-Icon (Join-Path $a "Square71x71Logo.png")    71  71  $false
            New-Icon (Join-Path $a "Square150x150Logo.png") 150 150  $false
            New-Icon (Join-Path $a "Square310x310Logo.png") 310 310  $false
            New-Icon (Join-Path $a "Wide310x150Logo.png")   310 150  $true
            New-Icon (Join-Path $a "SplashScreen.png")      620 300  $true
            New-Icon (Join-Path $a "BadgeLogo.png")          24  24  $false

            $sizes = @(16,20,24,30,32,36,40,48,60,64,72,80,96,256)
            foreach ($t in $sizes) {
              foreach ($suf in @("", "_altform-unplated", "_altform-lightunplated")) {
                New-Icon (Join-Path $a ("Square44x44Logo.targetsize-$t$suf.png")) $t $t $false
              }
            }
          } finally {
            if ($srcImg) { $srcImg.Dispose() }
            if ($drawSrc) { $drawSrc.Dispose() }
          }

          $iconN = @(Get-ChildItem $a -Recurse -File -Force -ErrorAction SilentlyContinue).Count
          Write-Host "icons = $iconN"
          if ($iconN -lt 50) { throw "图标过少: $iconN (期望 50)" }
          $need = @("StoreLogo.png","Square44x44Logo.png","Square150x150Logo.png","Square310x310Logo.png",
                    "Square71x71Logo.png","Wide310x150Logo.png","SplashScreen.png","BadgeLogo.png")
          foreach ($n in $need) { if (-not (Test-Path (Join-Path $a $n))) { throw "缺少图标: $n" } }
          $sizes = @(16,20,24,30,32,36,40,48,60,64,72,80,96,256)
          foreach ($t in $sizes) {
            foreach ($suf in @("","_altform-unplated","_altform-lightunplated")) {
              $fn = "Square44x44Logo.targetsize-$t$suf.png"
              if (-not (Test-Path (Join-Path $a $fn))) { throw "缺少 targetsize 资产: $fn" }
            }
          }
          Write-Host "all required icon assets present (8 base + 42 targetsize)"

          # ================= 清单 =================
          $pdn = [char]0xD835 + [char]0xDD78 + 'ik' + [char]0x0E19 + [char]0x795E + [char]0x6559 + [char]0x2728 + [char]0x6559 + [char]0x4E3B
          # 清单数组用 $mf，不要复用 $x —— $x 上面当过循环计数器，复用同一个名字容易踩坑。
          $mf = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap" xmlns:mp="http://schemas.microsoft.com/appx/2014/phone/manifest">'
            ('  <Identity Name="14714BE0.Venera" Publisher="CN=527BE4FD-4A22-42F5-9566-91D9CFF8BFFD" Version="' + $v + '" />')
            '  <Properties>'
            '    <DisplayName>Venera漫画</DisplayName>'
            ('    <PublisherDisplayName>' + $pdn + '</PublisherDisplayName>')
            '    <Description>Venera漫画 - 本地与在线漫画阅读器，支持 WebDAV 与自定义漫画源</Description>'
            '    <Logo>Assets\StoreLogo.png</Logo>'
            '  </Properties>'
            '  <Dependencies>'
            '    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" />'
            '  </Dependencies>'
            '  <Resources>'
            '    <Resource Language="zh-cn" />'
            '    <Resource Language="en-us" />'
            '  </Resources>'
            '  <Applications>'
            '    <Application Id="App" Executable="VeneraNext.exe" EntryPoint="Windows.FullTrustApplication">'
            ('      <uap:VisualElements DisplayName="Venera漫画" Description="Venera漫画 - 本地与在线漫画阅读器" BackgroundColor="' + $brandHex + '" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">')
            '        <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" Square310x310Logo="Assets\Square310x310Logo.png" Square71x71Logo="Assets\Square71x71Logo.png">'
            '          <uap:ShowNameOnTiles>'
            '            <uap:ShowOn Tile="square150x150Logo" />'
            '            <uap:ShowOn Tile="wide310x150Logo" />'
            '            <uap:ShowOn Tile="square310x310Logo" />'
            '          </uap:ShowNameOnTiles>'
            '        </uap:DefaultTile>'
            '        <uap:SplashScreen Image="Assets\SplashScreen.png" />'
            '        <uap:LockScreen BadgeLogo="Assets\BadgeLogo.png" Notification="badgeAndTileText" />'
            '      </uap:VisualElements>'
            '    </Application>'
            '  </Applications>'
            '  <Capabilities>'
            '    <Capability Name="internetClient" />'
            '    <rescap:Capability Name="runFullTrust" />'
            '  </Capabilities>'
            '  <mp:PhoneIdentity PhoneProductId="926903e4-7b05-4c92-b01b-6c25d2f4a335" PhonePublisherId="1bf42279-ce31-40ab-8b3e-fcd19d939971" />'
            '</Package>'
          )
          # 防御性重设：图标处理过程里若又不小心覆盖了 $s，这里再确认一次分阶段目录，
          # 避免清单被写到一串数字命名的目录下（AppxManifest.xml 找不到）。
          $s = "C:\S"
          [IO.File]::WriteAllText("$s\AppxManifest.xml", ($mf -join "`n"), (New-Object Text.UTF8Encoding $false))

      - name: Pack 3/3 - pri + package
        id: pack
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          trap {
            Write-Host "::error title=Pack-3-3::失败: $($_.Exception.Message)"
            Write-Host $_.InvocationInfo.PositionMessage
            exit 1
          }
          $s  = "C:\S"
          $a  = "$s\Assets"
          $v  = "${{ steps.stage.outputs.ver }}"
          $mk = "${{ steps.stage.outputs.mk }}"
          $mp = "${{ steps.stage.outputs.mp }}"
          Write-Host "MSIX version = $v"
          Write-Host "makeappx = $mk"
          $iconN = @(Get-ChildItem $a -Recurse -File -Force -ErrorAction SilentlyContinue).Count
          Write-Host "icons = $iconN"

          # ================= 生成 resources.pri =================
          # 关键：Square44x44Logo.targetsize-* 是「限定符资源」。
          # 没有 resources.pri，Windows 无法解析 TargetSize/Theme 限定符，
          # 只能退回「缩小图标 + 画底板」的渲染方式 —— 这就是任务栏出现底板的原因。
          $priOk = $false
          if ($mp -and (Test-Path $mp)) {
            Write-Host "makepri = $mp"
            $pricfgLines = @(
              '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
              '<resources targetOsVersion="10.0.0" majorVersion="1">',
              '  <packaging>',
              '    <autoResourcePackage qualifier="Language"/>',
              '    <autoResourcePackage qualifier="Scale"/>',
              '    <autoResourcePackage qualifier="DXFeatureLevel"/>',
              '  </packaging>',
              '  <index root="\" startIndexAt="\">',
              '    <default>',
              '      <qualifier name="Language" value="en-US"/>',
              '      <qualifier name="Contrast" value="standard"/>',
              '      <qualifier name="Scale" value="100"/>',
              '      <qualifier name="HomeRegion" value="001"/>',
              '      <qualifier name="TargetSize" value="256"/>',
              '      <qualifier name="LayoutDirection" value="LTR"/>',
              '      <qualifier name="Theme" value="dark"/>',
              '      <qualifier name="AlternateForm" value=""/>',
              '      <qualifier name="DXFeatureLevel" value="DX9"/>',
              '      <qualifier name="Configuration" value=""/>',
              '      <qualifier name="DeviceFamily" value="Universal"/>',
              '      <qualifier name="Custom" value=""/>',
              '    </default>',
              '    <indexer-config type="folder" foldernameAsQualifier="true" filenameAsQualifier="true" qualifierDelimiter="."/>',
              '    <indexer-config type="resw" convertDotsToSlashes="true" initialPath=""/>',
              '    <indexer-config type="resjson" initialPath=""/>',
              '    <indexer-config type="PRI"/>',
              '  </index>',
              '</resources>'
            )
            $cfgPath = "$s\priconfig.xml"
            try {
              [IO.File]::WriteAllText($cfgPath, ($pricfgLines -join "`n"), (New-Object Text.UTF8Encoding $false))
              $priPath = "$s\resources.pri"
              $priLog = & $mp new /pr $s /cf $cfgPath /mn "$s\AppxManifest.xml" /of $priPath /o 2>&1 | Out-String
              $cand = ($priLog -split "`n" | Where-Object { $_ -match "Resource Candidates" } | ForEach-Object { $_.Trim() }) -join " "
              Write-Host "makepri: $cand"
              if (-not (Test-Path $priPath)) {
                Write-Host "::warning::resources.pri 未生成，任务栏图标可能仍有底板"
                $priLog -split "`n" | ForEach-Object { if ($_.Trim()) { Write-Host "   " + $_.Trim() } }
              } else {
                $priOk = $true
                Write-Host "resources.pri = $((Get-Item $priPath).Length) bytes"
                # 关键补充校验：只「生成了 pri」不等于「索引成功」。
                # 若 startIndexAt 或限定符配置有误，makepri 会产出一个空壳 pri，
                # 图标照样退回「缩小 + 底板」。所以这里 dump 出来数一下 targetsize 条目。
                $dumpPath = "$env:RUNNER_TEMP\pri-dump.xml"
                Remove-Item $dumpPath -Force -ErrorAction SilentlyContinue
                & $mp dump /if $priPath /of $dumpPath /o 2>&1 | Out-Null
                if (Test-Path $dumpPath) {
                  $dumpText = Get-Content $dumpPath -Raw
                  $hits = ([regex]::Matches($dumpText, [regex]::Escape("targetsize-"))).Count
                  Write-Host "pri 内 targetsize 条目 = $hits"
                  if ($hits -lt 10) {
                    throw ("resources.pri 里 targetsize 条目过少（$hits）—— 限定符图标没被索引，" +
                           "任务栏会出现底板。已中止，避免发布坏包。")
                  }
                } else {
                  Write-Host "::warning::makepri dump 未产出，跳过 pri 内容校验"
                }
              }
            } finally {
              Remove-Item $cfgPath -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "::warning::未找到 makepri.exe，跳过 resources.pri 生成"
          }
          if (-not $priOk) { Write-Host "::warning::pri=False —— 图标可能显示底板，但仍会继续构建" }
          Write-Host "=== pri=$priOk ==="

          # ================= 打包 =================
          $out = "C:\out"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Write-Host "=== makeappx pack (.appx) ==="
          & $mk pack /d $s /p "$out\v.appx" /o 2>&1 | Tee-Object "$out\pack.log"
          if (-not (Test-Path "$out\v.appx")) {
            Write-Host "=== makeappx 输出尾部 ==="
            Get-Content "$out\pack.log" | Select-Object -Last 15 | ForEach-Object { Write-Host "   $_" }
            throw "makeappx pack 失败"
          }
          $msixMB = [math]::Round((Get-Item "$out\v.appx").Length/1MB,1)
          Write-Host "*** appx OK $msixMB MB ver=$v ***"

          # ================= 打包后复核成品 =================
          # 前面验的是「打包前的暂存目录」，这里验「真正要上传的成品」——
          # 确认 pri 与图标确实进了包，避免发布一个装上去没图标的包。
          Write-Host "=== 解包复核成品 ==="
          $vk = "$env:RUNNER_TEMP\verify"
          if (Test-Path $vk) { Remove-Item $vk -Recurse -Force -ErrorAction SilentlyContinue }
          $vlog = & $mk unpack /p "$out\v.appx" /d $vk /o 2>&1 | Out-String
          if (-not (Test-Path "$vk\AppxManifest.xml")) {
            Write-Host "::error::解包复核失败：成品包里没有 AppxManifest.xml"
            $vlog -split "`n" | Select-Object -Last 10 | ForEach-Object { Write-Host "   $_" }
            throw "解包复核失败"
          }
          if (-not (Test-Path "$vk\resources.pri")) {
            throw "解包复核失败：成品包里没有 resources.pri —— 图标会出现底板"
          }
          $vAssets = @(Get-ChildItem "$vk\Assets" -File -ErrorAction SilentlyContinue).Count
          $vPriKB  = [math]::Round((Get-Item "$vk\resources.pri").Length/1KB,1)
          Write-Host "  AppxManifest.xml  ok"
          Write-Host ("  resources.pri     ok ({0} KB)" -f $vPriKB)
          Write-Host ("  Assets            {0} 个" -f $vAssets)
          if ($vAssets -lt 50) { throw "解包复核失败：成品包里 Assets 只有 $vAssets 个" }
          Remove-Item $vk -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "成品复核通过"

          Write-Host "=== makeappx bundle (.msixbundle) ==="
          # 商店要求: 此应用上次提交用的是 msixbundle，后续必须继续用 bundle
          $bd = "C:\B"
          if (Test-Path $bd) { Remove-Item $bd -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $bd | Out-Null
          Copy-Item "$out\v.appx" (Join-Path $bd "Venera.msix") -Force
          & $mk bundle /d $bd /p "$out\v.msixbundle" /o 2>&1 | Tee-Object "$out\bundle.log"
          if (-not (Test-Path "$out\v.msixbundle")) {
            Write-Host "=== makeappx bundle 输出尾部 ==="
            Get-Content "$out\bundle.log" | Select-Object -Last 15 | ForEach-Object { Write-Host "   $_" }
            throw "makeappx bundle 失败"
          }
          $mb = [math]::Round((Get-Item "$out\v.msixbundle").Length/1MB,1)
          Write-Host "*** bundle OK $mb MB ver=$v ***"
          if ($mb -lt 10) { throw "msixbundle 过小: $mb MB" }

          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item "$out\v.msixbundle" "dist\Venera.msixbundle" -Force
          # 同时保留裸 .appx 作为兜底：万一商店不认 bundle，还能用这个试
          Copy-Item "$out\v.appx" "dist\Venera.appx" -Force

          "ver=$v"        | Out-File -Append $env:GITHUB_OUTPUT
          "mb=$mb"        | Out-File -Append $env:GITHUB_OUTPUT
          "icons=$iconN"  | Out-File -Append $env:GITHUB_OUTPUT
          "pri=$priOk"    | Out-File -Append $env:GITHUB_OUTPUT

      - name: Publish Release (latest)
        id: rel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag  = "latest"
          $v    = "${{ steps.pack.outputs.ver }}"
          $up   = "${{ needs.check.outputs.ver }}"
          $title = "Venera漫画 $v（最新）"
          $notes = "版本: $v`n上游版本: $up (build ${{ needs.check.outputs.build }})`n本次触发: ${{ needs.check.outputs.reason }}`nicons: ${{ steps.pack.outputs.icons }}`npri: ${{ steps.pack.outputs.pri }}`nlicense: ${{ steps.stage.outputs.lic }}`nfrom: CyrilPeng/Venera-Next"

          # 不再「删除再重建」——那样会让下载链接出现约 2 秒的 404 窗口。
          # 改成：不存在才创建；存在则用 --clobber 原地覆盖资源。
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release 不存在，创建 $tag"
            gh release create $tag --repo $repo --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create 失败" }
          } else {
            Write-Host "release 已存在，原地覆盖资源"
          }

          gh release upload $tag "dist\Venera.msixbundle" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 Venera.msixbundle 失败" }
          Write-Host "已上传 Venera.msixbundle"

          gh release upload $tag "dist\Venera.appx" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::上传 .appx 兜底资源失败（不影响 bundle）" }
          else { Write-Host "已上传 Venera.appx（兜底）" }

          gh release edit $tag --repo $repo --title $title --notes $notes
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::更新 release 说明失败" }

          $url = "https://github.com/$repo/releases/download/$tag/Venera.msixbundle"
          Write-Host "DIRECT URL = $url"
          "url=$url" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Upload artifact (fallback only)
        if: steps.rel.outcome != 'success'
        uses: actions/upload-artifact@v6
        with:
          name: venera-msixbundle
          path: dist/*
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

      - name: Save version
        # 只有发布成功才记录指纹，否则一次发布失败会让这个版本被永久跳过。
        # 指纹直接复用 check job 的输出 —— 不在 Windows 上重算哈希。
        # 若在两端各算一次，行尾转换(CRLF)会让哈希不一致，导致每天重复构建。
        if: steps.rel.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          $fp = "${{ needs.check.outputs.tag }}|${{ needs.check.outputs.zipsize }}|${{ needs.check.outputs.zupd }}|${{ needs.check.outputs.iconhash }}|${{ needs.check.outputs.wfhash }}"
          Write-Host "fingerprint = $fp"
          [IO.File]::WriteAllText("$PWD\.venera-ver", $fp, (New-Object Text.UTF8Encoding $false))
          git add .venera-ver
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { Write-Host "unchanged"; exit 0 }
          git commit -m "venera ver [skip ci]"
          git pull --rebase --autostash origin main; if ($LASTEXITCODE -ne 0) { Write-Host "::warning::rebase 失败" }
          git push; if ($LASTEXITCODE -ne 0) { Write-Host "::warning::push 失败（指纹未保存，下次会重复构建）" }

      - name: Email success
        if: success()
        shell: pwsh
        run: |
          # 注意：Send-MailMessage 抛的是非终止性错误，必须加 -ErrorAction Stop 才能进 catch。
          # 这样“没收到邮件”时能在 Annotations 里查到确切原因。
          try {
            $url    = "${{ steps.rel.outputs.url }}"
            $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if (-not $url) { $url = "(Release 未生成，请到 Actions 页下载 artifact)`n$runUrl" }
            $L = @(
              "Venera漫画 新包已构建完成。",
              "",
              "MSIX 版本: ${{ steps.pack.outputs.ver }}",
              "上游版本: ${{ needs.check.outputs.tag }} (build ${{ needs.check.outputs.build }})",
              "本次触发: ${{ needs.check.outputs.reason }}",
              "大小: ${{ steps.pack.outputs.mb }} MB",
              "图标: ${{ steps.pack.outputs.icons }} 个    pri: ${{ steps.pack.outputs.pri }}",
              "许可证: $(if ('${{ steps.stage.outputs.lic }}' -eq 'True') { '已附在包内 (LICENSE + SOURCE.txt)' } else { '缺失（建议上传 .github/app-legal/LICENSE）' })",
              "",
              "===== 第 1 步：下载 =====",
              "",
              "点这个链接（浏览器立即开始下载，永远是最新版）：",
              "",
              $url,
              "",
              "===== 第 2 步：上传商店 =====",
              "",
              "打开下面链接（直达 Venera漫画 页面）：",
              "https://partner.microsoft.com/zh-cn/dashboard/products/9P8TVBWFVX8Z/overview",
              "",
              "然后：",
              "  1. 点右上角的【更新】按钮",
              "  2. 上传刚下载的 Venera.msixbundle",
              "     （万一商店提示包格式问题，Release 页还有一个 Venera.appx 可试）",
              "  3. 提交认证（约 3 个工作日）",
              "",
              "-- GitHub Actions 自动发送"
            )
            $body = $L -join "`r`n"
            $sec  = ConvertTo-SecureString "${{ secrets.QQ_AUTH_CODE }}" -AsPlainText -Force
            $cred = New-Object System.Management.Automation.PSCredential("${{ secrets.QQ_EMAIL }}", $sec)
            Send-MailMessage -SmtpServer "smtp.qq.com" -Port 587 -UseSsl `
              -From "${{ secrets.QQ_EMAIL }}" -To "${{ secrets.QQ_EMAIL }}" `
              -Subject "[Venera] 新版本已就绪，可以发布到商店了" `
              -Body $body -Encoding UTF8 -Credential $cred -ErrorAction Stop
            Write-Host "::notice title=Mail-OK::成功邮件已发送"
          } catch {
            Write-Host "::warning title=Mail-FAILED::成功邮件发送失败：$($_.Exception.Message)"
          }

  # ============================================================
  # notify: 失败时发邮件（独立 job —— check 失败时 build 会被跳过，
  #         放在 build 里的失败邮件永远不会执行）
  # ============================================================
  notify:
    needs: [check, build]
    if: failure()
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Email failure
        run: |
          try {
            $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            $L = @(
              "Venera 自动构建失败了，需要你检查一下。",
              "",
              "check 结果: ${{ needs.check.result }}",
              "build 结果: ${{ needs.build.result }}",
              "",
              "常见原因:",
              "  1. 上游改了资产命名或 zip 结构（VeneraNext-<ver>-windows.zip 规律失效）",
              "  2. 下载失败或大小不符",
              "  3. makeappx / makepri 失败",
              "  4. 图标缺失或损坏（.github/store-icons/source.png）",
              "",
              "查看日志:",
              $runUrl,
              "",
              "-- GitHub Actions 自动发送"
            )
            $body = $L -join "`r`n"
            $sec  = ConvertTo-SecureString "${{ secrets.QQ_AUTH_CODE }}" -AsPlainText -Force
            $cred = New-Object System.Management.Automation.PSCredential("${{ secrets.QQ_EMAIL }}", $sec)
            Send-MailMessage -SmtpServer "smtp.qq.com" -Port 587 -UseSsl `
              -From "${{ secrets.QQ_EMAIL }}" -To "${{ secrets.QQ_EMAIL }}" `
              -Subject "[Venera] 构建失败，需要检查" `
              -Body $body -Encoding UTF8 -Credential $cred -ErrorAction Stop
            Write-Host "::notice title=Mail-OK::失败邮件已发送"
          } catch {
            Write-Host "::warning title=Mail-FAILED::失败邮件发送失败：$($_.Exception.Message)"
          }
